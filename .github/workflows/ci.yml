name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main half-way through a deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: Go — generate, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generated code is up to date
        run: make check-generated
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build
        run: make build

  migrations:
    name: Database — apply migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: efoy
          POSTGRES_PASSWORD: efoy
          POSTGRES_DB: efoy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U efoy -d efoy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://efoy:efoy@localhost:5432/efoy?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make migrate-up
      - run: make migrate-status

  web:
    name: Web — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  helm:
    name: Helm — lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: |
          helm lint deploy/helm/efoy -f deploy/helm/efoy/values-staging.yaml
          helm lint deploy/helm/efoy-deps
      - name: Render and validate against Kubernetes schemas
        run: |
          mkdir -p rendered
          helm template efoy deploy/helm/efoy -n efoy-staging -f deploy/helm/efoy/values-staging.yaml > rendered/efoy.yaml
          helm template efoy-deps deploy/helm/efoy-deps -n efoy-staging > rendered/deps.yaml
          docker run --rm -v "$PWD/rendered":/m ghcr.io/yannh/kubeconform:latest -strict -summary /m/efoy.yaml /m/deps.yaml

  images:
    name: Image — ${{ matrix.service }}
    needs: [go, migrations, web, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [core-api, tracking-ingest, realtime-gateway, dispatch-engine, workers, web]
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service == 'web' && 'web/Dockerfile' || 'Dockerfile' }}
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          push: ${{ env.PUSH == 'true' }}
          tags: ghcr.io/${{ github.repository_owner }}/efoy-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # GitOps: point staging at the images just pushed. Argo CD watches main and
  # syncs the change (deploy/argocd/staging.yaml).
  deploy-staging:
    name: Deploy — staging
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set image tag
        run: yq -i '.image.tag = "${{ github.sha }}"' deploy/helm/efoy/values-staging.yaml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/efoy/values-staging.yaml
          git diff --cached --quiet && exit 0
          git commit -m "deploy(staging): ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
