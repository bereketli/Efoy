# k3s ships Traefik; this HelmChartConfig adds Let's Encrypt certificates
# (resolver "letsencrypt", used by the efoy Ingress) and redirects HTTP to
# HTTPS. Copy to /var/lib/rancher/k3s/server/manifests/ on the server node, or
#   kubectl apply -f deploy/k3s/traefik-config.yaml
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
    persistence:
      enabled: true          # keep issued certificates across restarts
      size: 128Mi
    certificatesResolvers:
      letsencrypt:
        acme:
          email: ops@efoy.et
          storage: /data/acme.json
          tlsChallenge: {}
    # Traefik refuses an acme.json readable by others; fix the volume mode.
    deployment:
      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          command: ["sh", "-c", "touch /data/acme.json && chmod 600 /data/acme.json"]
          volumeMounts:
            - name: data
              mountPath: /data
    podSecurityContext:
      fsGroup: 65532
