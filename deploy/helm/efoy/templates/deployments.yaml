{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "efoy.name" (list $ $name) }}
  labels:
    {{- include "efoy.labels" $ | nindent 4 }}
    {{- include "efoy.selector" (list $ $name) | nindent 4 }}
spec:
  {{- if not $svc.autoscaling.enabled }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "efoy.selector" (list $ $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "efoy.selector" (list $ $name) | nindent 8 }}
      annotations:
        # Restart pods when the shared config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ $name }}
          image: {{ include "efoy.image" (list $ $name) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          envFrom:
            {{- include "efoy.envFrom" $ | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "efoy.name" (list $ $name) }}
  labels:
    {{- include "efoy.labels" $ | nindent 4 }}
    {{- include "efoy.selector" (list $ $name) | nindent 4 }}
spec:
  selector:
    {{- include "efoy.selector" (list $ $name) | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if $svc.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "efoy.name" (list $ $name) }}
  labels:
    {{- include "efoy.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "efoy.name" (list $ $name) }}
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.autoscaling.targetCPU }}
{{- end }}
{{- end }}
