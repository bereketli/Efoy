# Secret with POSTGRES_PASSWORD, REDIS_PASSWORD, RUSTFS_ACCESS_KEY and
# RUSTFS_SECRET_KEY, created from deploy/secrets (see deploy/README.md).
existingSecret: efoy-deps-secrets

storageClass: ""  # empty = cluster default (local-path on k3s)

postgres:
  image: timescale/timescaledb-ha:pg16
  database: efoy
  user: efoy
  storage: 20Gi
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }

redis:
  image: redis:7-alpine
  storage: 1Gi
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

nats:
  image: nats:2.10-alpine
  storage: 5Gi
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 512Mi }

s3:
  image: rustfs/rustfs:latest
  storage: 20Gi
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }
