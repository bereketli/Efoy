{{- $env := list
  (include "deps.secretEnv" (list . "MINIO_ROOT_USER") | fromYamlArray | first)
  (include "deps.secretEnv" (list . "MINIO_ROOT_PASSWORD") | fromYamlArray | first)
-}}
{{- $probe := dict "httpGet" (dict "path" "/minio/health/ready" "port" 9000) "periodSeconds" 10 -}}
{{- include "deps.store" (dict
  "root" . "name" "minio" "cfg" .Values.minio
  "ports" (dict "api" 9000 "console" 9001)
  "args" (list "server" "/data" "--console-address" ":9001")
  "env" $env "probe" $probe
  "mountPath" "/data") }}
---
# Creates the buckets after every sync (idempotent).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-minio-buckets
  labels:
    {{- include "deps.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: {{ .Values.minio.mcImage }}
          env:
            {{- include "deps.secretEnv" (list . "MINIO_ROOT_USER") | nindent 12 }}
            {{- include "deps.secretEnv" (list . "MINIO_ROOT_PASSWORD") | nindent 12 }}
          command: ["/bin/sh", "-c"]
          args:
            - >
              mc alias set efoy http://{{ .Release.Name }}-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
              mc mb --ignore-existing {{ range .Values.minio.buckets }}efoy/{{ . }} {{ end }}
