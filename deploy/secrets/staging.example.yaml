# Template for staging secrets. NEVER commit a filled-in copy unencrypted.
#   cp deploy/secrets/staging.example.yaml deploy/secrets/staging.enc.yaml
#   # fill in the values (go run ./cmd/core-api gen-keys for the auth keys)
#   sops --encrypt --in-place deploy/secrets/staging.enc.yaml
#   make staging-secrets   # decrypts and applies to the cluster
apiVersion: v1
kind: Secret
metadata:
  name: efoy-secrets
  namespace: efoy-staging
type: Opaque
stringData:
  EFOY_DATABASE__URL: postgres://efoy:CHANGE_ME@efoy-deps-postgres:5432/efoy?sslmode=disable
  EFOY_REDIS__PASSWORD: CHANGE_ME
  EFOY_AUTH__SIGNING_KEY_ID: "2026-10"
  EFOY_AUTH__SIGNING_KEY: |
    -----BEGIN PRIVATE KEY-----
    CHANGE_ME
    -----END PRIVATE KEY-----
  EFOY_AUTH__TOTP_KEY: CHANGE_ME_BASE64_32_BYTES
  EFOY_S3__ACCESS_KEY: efoy
  EFOY_S3__SECRET_KEY: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: efoy-deps-secrets
  namespace: efoy-staging
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME          # same as in EFOY_DATABASE__URL
  REDIS_PASSWORD: CHANGE_ME             # same as EFOY_REDIS__PASSWORD
  RUSTFS_ACCESS_KEY: efoy               # same as EFOY_S3__ACCESS_KEY
  RUSTFS_SECRET_KEY: CHANGE_ME          # same as EFOY_S3__SECRET_KEY
