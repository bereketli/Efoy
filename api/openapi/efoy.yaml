openapi: 3.0.3
info:
  title: Efoy API
  version: 0.1.0
  description: |
    Public REST API for the Efoy shared-commute platform (design doc section 12).
    This file is the source of truth: the Go server (oapi-codegen) and the web
    client (openapi-typescript) are generated from it. Add an endpoint here
    first, the same day it is built.

    Conventions: RFC 3339 UTC timestamps, cursor pagination
    (`?limit=&cursor=` -> `next_cursor`), RFC 9457 problem+json errors,
    `Accept-Language: am | en | om`.
servers:
  - url: https://api.efoy.et
    description: Production
  - url: http://localhost:8080
    description: Local development
tags:
  - name: health
  - name: auth
  - name: me
  - name: drivers
  - name: vehicles
  - name: documents
  - name: admin
security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The process is serving requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { status: ok, service: core-api, version: v0.1.0 }

  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: Readiness probe (checks dependencies such as Postgres)
      security: []
      responses:
        "200":
          description: All dependencies are reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { status: ok, service: core-api, version: v0.1.0, checks: { postgres: ok } }
        "503":
          description: At least one dependency is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { status: unavailable, service: core-api, version: v0.1.0, checks: { postgres: fail } }

  /.well-known/jwks.json:
    get:
      tags: [auth]
      operationId: getJwks
      summary: Public keys that verify access tokens (Ed25519, JWKS)
      description: Includes the active key and, after a rotation, the previous one.
      security: []
      responses:
        "200":
          description: The JSON Web Key Set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JWKS" }

  /v1/auth/otp/request:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: Send a 6-digit SMS OTP to a phone number
      description: Rate-limited to 3 requests per 10 minutes per phone (FR-IAM-1).
      security: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpRequest" }
            example: { phone_e164: "+251911234567" }
      responses:
        "202":
          description: OTP sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpRequested" }
              example: { expires_in_s: 300, resend_after_s: 60 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Verify an OTP and receive access and refresh tokens
      description: 5-minute expiry and at most 5 attempts per OTP (FR-IAM-1). Creates the user on first login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpVerify" }
            example:
              phone_e164: "+251911234567"
              code: "482913"
              device: { platform: ANDROID, app_version: "1.0.0" }
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Staff login for the web portals (email + password + TOTP)
      description: |
        TOTP is mandatory for DISPATCHER, SUPPORT_AGENT and SUPER_ADMIN (FR-IAM-2).
        When a required code is missing the API answers 401 with code `TOTP_REQUIRED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { email: "dispatcher@efoy.et", password: "correct horse battery staple", totp_code: "123456" }
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Rotate a refresh token
      description: Refresh tokens rotate on every use; reusing an old one revokes the whole family (FR-IAM-3).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: New token pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Session revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Current user's profile, roles and linked riders
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Update the current user's name and language
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeUpdate" }
            example: { full_name: "Abebe Kebede", full_name_am: "አበበ ከበደ", preferred_language: am }
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/drivers:
    post:
      tags: [drivers]
      operationId: registerDriver
      summary: Register the current user as a driver (FR-DRV-1)
      description: |
        The new driver starts PENDING. The DRIVER role is granted at once; refresh
        the access token to see it in the token claims.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverInput" }
            example:
              source: TAXI
              licence_number: "AA-1234567"
              licence_category: "Public 2"
              licence_expires_on: "2029-06-30"
              emergency_contact_name: "Almaz Kebede"
              emergency_contact_phone: "+251911000111"
      responses:
        "201":
          description: Driver created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/drivers/me:
    get:
      tags: [drivers]
      operationId: getMyDriver
      summary: The current user's driver profile with vehicles and documents
      responses:
        "200":
          description: Driver profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/drivers/{id}:
    get:
      tags: [drivers]
      operationId: getDriver
      summary: A driver profile (the driver, dispatchers, support and super admins)
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Driver profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/vehicles:
    post:
      tags: [vehicles]
      operationId: registerVehicle
      summary: Register a vehicle owned by the current driver (FR-DRV-2)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleInput" }
            example:
              plate_number: "AA-3-12345"
              vehicle_class: MINIBUS
              make: Toyota
              model: HiAce
              year: 2018
              colour: White
              passenger_seats: 12
              has_seatbelts: true
              has_first_aid: true
      responses:
        "201":
          description: Vehicle created (PENDING until its documents are approved).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/documents/upload-url:
    post:
      tags: [documents]
      operationId: createDocumentUploadUrl
      summary: Get a pre-signed URL to upload a document file (FR-DRV-3)
      description: |
        PUT the file to upload_url with the same Content-Type within 15 minutes,
        then record it with POST /v1/documents using the returned file_key.
        JPEG, PNG, WebP or PDF, at most 10 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
            example: { owner_type: DRIVER, owner_id: "01926f3a-7c1e-7d2b-9a41-5f0c3b8e2d11", doc_type: DRIVING_LICENCE, content_type: image/jpeg }
      responses:
        "201":
          description: Upload URL created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrl" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/documents:
    post:
      tags: [documents]
      operationId: submitDocument
      summary: Record an uploaded document for review (FR-DRV-3)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentInput" }
      responses:
        "201":
          description: Document submitted (PENDING).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/documents:
    get:
      tags: [admin]
      operationId: listDocumentsForReview
      summary: Document review queue, oldest first
      parameters:
        - name: status
          in: query
          description: Defaults to PENDING and UNDER_REVIEW.
          schema:
            type: array
            items: { $ref: "#/components/schemas/DocumentStatus" }
          style: form
          explode: false
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of documents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/documents/{id}:
    get:
      tags: [admin]
      operationId: getDocumentForReview
      summary: One document with a short-lived URL to view the file
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/documents/{id}/review:
    post:
      tags: [admin]
      operationId: reviewDocument
      summary: Approve or reject a document (super admin, dispatcher)
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentReview" }
            example: { decision: REJECT, reason: "The photo is blurry; the licence number cannot be read." }
      responses:
        "200":
          description: The reviewed document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA-signed access token, 15-minute lifetime.

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: next_cursor from the previous page.
      schema: { type: string }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: { $ref: "#/components/schemas/Language" }

  responses:
    Forbidden:
      description: The caller may not do this.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Conflicts with the current state (duplicate, already reviewed...).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://docs.efoy.et/errors/validation
            title: Invalid request
            status: 400
            code: VALIDATION_FAILED
            detail: phone_e164 must be in E.164 format, e.g. +251911234567.
    Unauthorized:
      description: Missing, invalid or expired credentials.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://docs.efoy.et/errors/unauthorized
            title: Unauthorized
            status: 401
            code: INVALID_CREDENTIALS
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, crv, x, kid, alg, use]
            properties:
              kty: { type: string, enum: [OKP] }
              crv: { type: string, enum: [Ed25519] }
              x: { type: string, description: Base64url public key. }
              kid: { type: string }
              alg: { type: string, enum: [EdDSA] }
              use: { type: string, enum: [sig] }

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string, description: Stable machine-readable error code. }
        detail: { type: string }

    HealthStatus:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        service: { type: string }
        version: { type: string }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, fail] }

    Language:
      type: string
      enum: [am, en, om]

    PhoneE164:
      type: string
      pattern: '^\+[1-9][0-9]{7,14}$'
      example: "+251911234567"

    Role:
      type: string
      enum:
        - STUDENT_RIDER
        - CIVIL_SERVANT_RIDER
        - GUARDIAN
        - DRIVER
        - FLEET_OWNER
        - INSTITUTION_ADMIN
        - DISPATCHER
        - SUPPORT_AGENT
        - SUPER_ADMIN

    Scope:
      type: string
      enum: [GLOBAL, INSTITUTION, FLEET, ZONE]

    RoleGrant:
      type: object
      required: [role, scope]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        scope: { $ref: "#/components/schemas/Scope" }
        scope_id:
          type: string
          format: uuid
          nullable: true
          description: Institution, fleet or zone id; null for GLOBAL.

    DevicePlatform:
      type: string
      enum: [ANDROID, IOS, WEB]

    DeviceInfo:
      type: object
      required: [platform]
      properties:
        platform: { $ref: "#/components/schemas/DevicePlatform" }
        push_token: { type: string }
        app_version: { type: string }
        os_version: { type: string }

    OtpRequest:
      type: object
      required: [phone_e164]
      properties:
        phone_e164: { $ref: "#/components/schemas/PhoneE164" }

    OtpRequested:
      type: object
      required: [expires_in_s, resend_after_s]
      properties:
        expires_in_s: { type: integer, example: 300 }
        resend_after_s: { type: integer, example: 60 }

    OtpVerify:
      type: object
      required: [phone_e164, code]
      properties:
        phone_e164: { $ref: "#/components/schemas/PhoneE164" }
        code: { type: string, pattern: '^[0-9]{6}$' }
        device: { $ref: "#/components/schemas/DeviceInfo" }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 12 }
        totp_code: { type: string, pattern: '^[0-9]{6}$' }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    TokenPair:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, user]
      properties:
        access_token: { type: string, description: EdDSA-signed JWT. }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Access token lifetime in seconds., example: 900 }
        refresh_token: { type: string, description: Opaque token, 30-day sliding expiry. }
        user: { $ref: "#/components/schemas/Me" }
      example:
        access_token: eyJhbGciOiJFZERTQSIsImtpZCI6IjIwMjYtMDkifQ.e30.c2ln
        token_type: Bearer
        expires_in: 900
        refresh_token: 3q2-7wEXAMPLEonlyEXAMPLEonly
        user:
          id: 01926f3a-7c1e-7d2b-9a41-5f0c3b8e2d11
          full_name: Abebe Kebede
          phone_e164: "+251911234567"
          preferred_language: am
          roles: [{ role: GUARDIAN, scope: GLOBAL, scope_id: null }]
          linked_rider_ids: []

    Me:
      type: object
      required: [id, full_name, preferred_language, roles, linked_rider_ids]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        full_name_am: { type: string, nullable: true }
        phone_e164: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        preferred_language: { $ref: "#/components/schemas/Language" }
        photo_url: { type: string, format: uri, nullable: true, description: Short-lived signed URL. }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleGrant" }
        linked_rider_ids:
          type: array
          description: Riders this user guards or is.
          items: { type: string, format: uuid }

    MeUpdate:
      type: object
      properties:
        full_name: { type: string, minLength: 1, maxLength: 120 }
        full_name_am: { type: string, maxLength: 120, nullable: true }
        preferred_language: { $ref: "#/components/schemas/Language" }

    DriverSource:
      type: string
      enum: [TAXI, YANGO, INDEPENDENT]

    OnboardingStatus:
      type: string
      enum: [PENDING, UNDER_REVIEW, APPROVED, ACTIVE, SUSPENDED, REJECTED]

    DriverInput:
      type: object
      required: [source, licence_number, licence_category, licence_expires_on]
      properties:
        source: { $ref: "#/components/schemas/DriverSource" }
        licence_number: { type: string, minLength: 3, maxLength: 40 }
        licence_category: { type: string, minLength: 1, maxLength: 40 }
        licence_expires_on: { type: string, format: date }
        emergency_contact_name: { type: string, maxLength: 120 }
        emergency_contact_phone: { $ref: "#/components/schemas/PhoneE164" }

    Driver:
      type: object
      required: [id, user_id, full_name, source, licence_number, licence_category, licence_expires_on, status, student_certified, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        full_name: { type: string }
        phone_e164: { type: string, nullable: true }
        source: { $ref: "#/components/schemas/DriverSource" }
        licence_number: { type: string }
        licence_category: { type: string }
        licence_expires_on: { type: string, format: date }
        emergency_contact_name: { type: string, nullable: true }
        emergency_contact_phone: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/OnboardingStatus" }
        student_certified: { type: boolean }
        created_at: { type: string, format: date-time }

    DriverProfile:
      type: object
      required: [driver, vehicles, documents]
      properties:
        driver: { $ref: "#/components/schemas/Driver" }
        vehicles:
          type: array
          items: { $ref: "#/components/schemas/Vehicle" }
        documents:
          type: array
          description: Documents of the driver and of their vehicles, newest first.
          items: { $ref: "#/components/schemas/Document" }

    VehicleClass:
      type: string
      enum: [MINIBUS, MIDIBUS, SEDAN, SUV]

    VehicleInput:
      type: object
      required: [plate_number, vehicle_class, make, model, year, colour, passenger_seats]
      properties:
        plate_number: { type: string, minLength: 3, maxLength: 15 }
        vehicle_class: { $ref: "#/components/schemas/VehicleClass" }
        make: { type: string, maxLength: 60 }
        model: { type: string, maxLength: 60 }
        year: { type: integer, minimum: 1990 }
        colour: { type: string, maxLength: 30 }
        passenger_seats: { type: integer, minimum: 1, maximum: 16 }
        has_seatbelts: { type: boolean, default: true }
        has_first_aid: { type: boolean, default: false }

    Vehicle:
      type: object
      required: [id, plate_number, vehicle_class, make, model, year, colour, passenger_seats, has_seatbelts, has_first_aid, status, created_at]
      properties:
        id: { type: string, format: uuid }
        owner_driver_id: { type: string, format: uuid, nullable: true }
        fleet_owner_id: { type: string, format: uuid, nullable: true }
        plate_number: { type: string }
        vehicle_class: { $ref: "#/components/schemas/VehicleClass" }
        make: { type: string }
        model: { type: string }
        year: { type: integer }
        colour: { type: string }
        passenger_seats: { type: integer }
        has_seatbelts: { type: boolean }
        has_first_aid: { type: boolean }
        status: { $ref: "#/components/schemas/OnboardingStatus" }
        created_at: { type: string, format: date-time }

    DocumentOwnerType:
      type: string
      enum: [DRIVER, VEHICLE]

    DocumentType:
      type: string
      description: |
        DRIVER: DRIVING_LICENCE, POLICE_CLEARANCE, PHOTO, YANGO_PROFILE, OTHER.
        VEHICLE: VEHICLE_LIBRE, INSURANCE, ANNUAL_INSPECTION, PHOTO, OTHER.
      enum: [DRIVING_LICENCE, VEHICLE_LIBRE, INSURANCE, ANNUAL_INSPECTION, POLICE_CLEARANCE, PHOTO, YANGO_PROFILE, TRADE_LICENCE, TIN_CERTIFICATE, OTHER]

    DocumentStatus:
      type: string
      enum: [PENDING, UNDER_REVIEW, APPROVED, REJECTED, EXPIRED]

    UploadUrlRequest:
      type: object
      required: [owner_type, owner_id, doc_type, content_type]
      properties:
        owner_type: { $ref: "#/components/schemas/DocumentOwnerType" }
        owner_id: { type: string, format: uuid }
        doc_type: { $ref: "#/components/schemas/DocumentType" }
        content_type: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }

    UploadUrl:
      type: object
      required: [upload_url, file_key, expires_at, max_bytes]
      properties:
        upload_url: { type: string, format: uri }
        file_key: { type: string }
        expires_at: { type: string, format: date-time }
        max_bytes: { type: integer, example: 10485760 }

    DocumentInput:
      type: object
      required: [owner_type, owner_id, doc_type, file_key]
      properties:
        owner_type: { $ref: "#/components/schemas/DocumentOwnerType" }
        owner_id: { type: string, format: uuid }
        doc_type: { $ref: "#/components/schemas/DocumentType" }
        file_key: { type: string }
        doc_number: { type: string, maxLength: 60 }
        issued_on: { type: string, format: date }
        expires_on:
          type: string
          format: date
          description: Required for DRIVING_LICENCE, INSURANCE and ANNUAL_INSPECTION; must be in the future.

    Document:
      type: object
      required: [id, owner_type, owner_id, owner_label, doc_type, status, content_type, created_at]
      properties:
        id: { type: string, format: uuid }
        owner_type: { $ref: "#/components/schemas/DocumentOwnerType" }
        owner_id: { type: string, format: uuid }
        owner_label: { type: string, description: Driver name or vehicle plate. }
        doc_type: { $ref: "#/components/schemas/DocumentType" }
        doc_number: { type: string, nullable: true }
        issued_on: { type: string, format: date, nullable: true }
        expires_on: { type: string, format: date, nullable: true }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        content_type: { type: string }
        rejection_reason: { type: string, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        view_url:
          type: string
          format: uri
          nullable: true
          description: Short-lived URL to the file (admin endpoints only).

    DocumentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        next_cursor: { type: string, nullable: true }

    DocumentReview:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVE, REJECT] }
        reason: { type: string, maxLength: 500, description: Required when rejecting; shown to the driver. }
